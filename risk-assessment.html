<script>
    let rowId = 1;

    function addRow() {
        const tbody = document.getElementById('tableBody');
        const row = document.createElement('tr');
        row.id = `row-${rowId}`;
        
        row.innerHTML = `
            <td><textarea placeholder="Describe the hazard" oninput="autoResize(this)"></textarea></td>
            <td><textarea placeholder="Who is at risk and how" oninput="autoResize(this)"></textarea></td>
            <td><textarea placeholder="Existing control measures" oninput="autoResize(this)"></textarea></td>
            <td><textarea placeholder="Additional actions needed" oninput="autoResize(this)"></textarea></td>
            <td><input type="text" placeholder="Person responsible"></td>
            <td><input type="date"></td>
            <td class="text-center"><input type="checkbox"></td>
            <td class="text-center print-hidden">
                <button class="btn-delete" onclick="deleteRow(${rowId})">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </td>
        `;
        
        tbody.appendChild(row);
        rowId++;
        updateDeleteButtons();
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function deleteRow(id) {
        const row = document.getElementById(`row-${id}`);
        if (row && document.getElementById('tableBody').children.length > 1) {
            row.remove();
            updateDeleteButtons();
        }
    }

    function updateDeleteButtons() {
        const tbody = document.getElementById('tableBody');
        const deleteButtons = tbody.querySelectorAll('.btn-delete');
        const isOnlyRow = tbody.children.length === 1;
        
        deleteButtons.forEach(button => {
            button.disabled = isOnlyRow;
        });
    }

    function collectFormData() {
        const data = {
            schoolName: document.getElementById('schoolName').value,
            assessedBy: document.getElementById('assessedBy').value,
            nextReview: document.getElementById('nextReview').value,
            dateCarriedOut: document.getElementById('dateCarriedOut').value,
            rows: []
        };

        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            const textareas = row.querySelectorAll('textarea');
            const inputs = row.querySelectorAll('input');
            
            data.rows.push({
                hazard: textareas[0]?.value || '',
                whoHarmed: textareas[1]?.value || '',
                currentControls: textareas[2]?.value || '',
                furtherAction: textareas[3]?.value || '',
                actionBy: inputs[0]?.value || '',
                actionDate: inputs[1]?.value || '',
                done: inputs[2]?.checked || false
            });
        });

        return data;
    }

    function openPrintVersion() {
        const data = collectFormData();
        
        // Use sessionStorage instead of URL parameters
        try {
            sessionStorage.setItem('riskAssessmentData', JSON.stringify(data));
            window.open(window.location.pathname + '?print=true', '_blank');
        } catch (e) {
            alert('Unable to open print window. Please try using the browser print function (Ctrl+P or Cmd+P)');
        }
    }

    function loadFormData() {
        const urlParams = new URLSearchParams(window.location.search);
        const isPrintMode = urlParams.get('print') === 'true';
        
        if (isPrintMode) {
            try {
                const dataStr = sessionStorage.getItem('riskAssessmentData');
                if (dataStr) {
                    const data = JSON.parse(dataStr);
                    
                    document.getElementById('schoolName').value = data.schoolName || '';
                    document.getElementById('assessedBy').value = data.assessedBy || '';
                    document.getElementById('nextReview').value = data.nextReview || '';
                    document.getElementById('dateCarriedOut').value = data.dateCarriedOut || '';

                    document.getElementById('tableBody').innerHTML = '';
                    rowId = 1;

                    data.rows.forEach(rowData => {
                        const tbody = document.getElementById('tableBody');
                        const row = document.createElement('tr');
                        row.id = `row-${rowId}`;
                        
                        row.innerHTML = `
                            <td><textarea placeholder="Describe the hazard" oninput="autoResize(this)">${rowData.hazard}</textarea></td>
                            <td><textarea placeholder="Who is at risk and how" oninput="autoResize(this)">${rowData.whoHarmed}</textarea></td>
                            <td><textarea placeholder="Existing control measures" oninput="autoResize(this)">${rowData.currentControls}</textarea></td>
                            <td><textarea placeholder="Additional actions needed" oninput="autoResize(this)">${rowData.furtherAction}</textarea></td>
                            <td><input type="text" placeholder="Person responsible" value="${rowData.actionBy}"></td>
                            <td><input type="date" value="${rowData.actionDate}"></td>
                            <td class="text-center"><input type="checkbox" ${rowData.done ? 'checked' : ''}></td>
                            <td class="text-center print-hidden">
                                <button class="btn-delete" onclick="deleteRow(${rowId})">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        <line x1="10" y1="11" x2="10" y2="17"></line>
                                        <line x1="14" y1="11" x2="14" y2="17"></line>
                                    </svg>
                                </button>
                            </td>
                        `;
                        
                        tbody.appendChild(row);
                        rowId++;
                    });

                    updateDeleteButtons();

                    setTimeout(() => {
                        document.querySelectorAll('textarea').forEach(autoResize);
                    }, 100);

                    setTimeout(() => {
                        sessionStorage.removeItem('riskAssessmentData');
                        window.print();
                    }, 500);
                    
                    return;
                }
            } catch (e) {
                console.error('Error loading data:', e);
            }
        }
        
        addRow();
    }

    window.onload = function() {
        loadFormData();
    };
</script>
